name: Build and Deploy to Itch.io

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      # --- ITCH.IO BUTLER SETUP ---
      - name: Install Butler CLI
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d butler-cli
          chmod +x butler-cli/butler
          echo "$GITHUB_WORKSPACE/butler-cli" >> $GITHUB_PATH

      # --- DEPLOY WEB VERSION TO ITCH.IO ---
      - name: Push Web Build to Itch.io
        run: butler push dist igdevs/kafakafaya:web
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      # --- ANDROID SDK & JDK SETUP ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Sync Capacitor Android Project
        run: npx cap sync

      # --- BUILD APK ---
      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # --- DEPLOY APK TO ITCH.IO ---
      - name: Push APK Build to Itch.io
        run: butler push android/app/build/outputs/apk/debug/app-debug.apk igdevs/kafakafaya:android
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      # --- OPTIONAL: UPLOAD APK AS GITHUB ARTIFACT ---
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kafakafaya-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
